name: Windows desktop

on:
  push:
    branches: [dev]
    tags:
      - 'v*'
      - '!v*-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication for a branch. A newer branch HEAD is checked again
# immediately before a release becomes visible to application update checks.
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.build.outputs.version }}
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
          architecture: x64

      - name: Test release publication guards offline
        run: node --test scripts/publish-release.test.cjs

      - name: Test, publish, and package
        id: build
        run: ./scripts/ci-build.ps1

      - name: Upload tested Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MillBeam-Windows-x64
          path: release/distributables/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload test logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MillBeam-test-results
          path: release/test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish tested GitHub update
    needs: build
    if: >-
      github.repository == 'BigUziHert/MillBeam' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: MillBeam-Windows-x64
          path: release/distributables

      - name: Publish complete release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          MILLBEAM_VERSION: ${{ needs.build.outputs.version }}
        with:
          github-token: ${{ github.token }}
          script: |
            const publish = require('./scripts/publish-release.cjs');
            await publish({ github, context, core });
